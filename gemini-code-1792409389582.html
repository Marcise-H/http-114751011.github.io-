<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蒙特卡羅隨機漫步模擬器 (Monte Carlo Random Walk)</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent-avg: #f97316;
      --accent-target: #10b981;
      --accent-path: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    h1 {
      font-size: 1.5rem;
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0284c7;
      color: #000;
    }

    .btn-primary:hover {
      background-color: #7dd3fc;
    }

    .btn-export {
      background-color: #10b981;
      color: #000;
    }

    .btn-export:hover {
      background-color: #34d399;
    }

    .btn-danger {
      background-color: #ef4444;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    .layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 20px;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--primary);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .param-group {
      margin-bottom: 18px;
    }

    .param-label-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    label {
      font-size: 0.9rem;
      color: var(--text-main);
    }

    .num-input {
      width: 8
